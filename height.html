</h1>


<p>

Feet / Inches / lbs 自动转换 cm 和 kg

</p>


</div>







<div class="tool-card">



<h2>

输入信息

</h2>




<div class="input-row">


<div>


<label>

Height (ft)

</label>


<input 
id="height-ft" 
type="number" 
placeholder="例如：5">


</div>





<div>


<label>

Height (in)

</label>


<input 
id="height-in" 
type="number" 
placeholder="例如：10">


</div>



</div>







<div class="input-row">


<div>


<label>

Weight (lbs)

</label>


<input 
id="weight-lbs" 
type="number" 
placeholder="例如：165">


</div>


</div>






<button 
onclick="convertHeightWeight()" 
class="calculate-btn">

计算

</button>



</div>








<div class="result-box">


<h3>

计算结果

</h3>



<p id="result">

等待计算...
