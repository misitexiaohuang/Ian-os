<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>寄样审核</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="app-layout">



<!-- 左侧导航 -->

<aside class="sidebar">


<div class="brand">


<h2>
Ian OS
</h2>


<p>
TikTok运营系统
</p>


</div>






<!-- 动态导航 -->

<div class="menu" id="menu">


</div>






<div class="sidebar-footer">

Ian OS v1.0

</div>



</aside>









<main class="content">



<div class="container">







<div class="hero">


<h1>

📦 寄样审核

</h1>


<p>

达人样品申请审核管理

</p>


</div>









<!-- 新增申请 -->


<div class="tool-card">


<h2>

➕ 新增样品申请

</h2>







<div class="input-row">



<div>


<label>

达人 Handle

</label>


<input

id="handle"

placeholder="@creator">


</div>








<div>


<label>

申请产品

</label>


<input

id="product"

placeholder="例如 GATs / Shorts">


</div>



</div>









<div class="input-row">


<div>


<label>

样品申请时间

</label>


<input

id="apply-date"

type="date">


</div>



</div>








<div class="input-row">


<div style="flex:2;">


<label>

备注

</label>


<input

id="remark"

placeholder="例如：高质量达人 / 等待回复">


</div>



</div>







<button

class="calculate-btn"

onclick="addSample()">


添加记录


</button>






</div>









<!-- 审核列表 -->


<div class="tool-card">


<h2>

📋 审核列表

</h2>







<div style="margin-bottom:20px;">



<button

onclick="sortSample('desc')"

class="calculate-btn"

style="width:auto;padding:0 25px;margin-right:10px;">


距离申样时间 长 → 短


</button>






<button

onclick="sortSample('asc')"

class="calculate-btn"

style="width:auto;padding:0 25px;">


距离申样时间 短 → 长


</button>




</div>









<div class="table-box">


<table>


<thead>


<tr>


<th>

达人Handle

</th>



<th>

申请产品

</th>



<th>

样品申请时间

</th>



<th>

距离申样时间

</th>



<th>

备注

</th>



<th>

操作

</th>


</tr>


</thead>






<tbody id="sample-list">


</tbody>





</table>


</div>






</div>









</div>


</main>



</div>









<script src="sample.js"></script>

<script src="nav.js"></script>


</body>


</html>
