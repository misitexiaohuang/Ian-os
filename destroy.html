<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>销毁费用预估</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="app-layout">



<!-- 左侧导航 -->

<aside class="sidebar">


<div class="brand">


<h2>
Ian OS
</h2>


<p>
TikTok运营系统
</p>


</div>






<!-- 动态导航 -->

<div class="menu" id="menu">


</div>






<div class="sidebar-footer">

Ian OS v1.0

</div>



</aside>









<main class="content">



<div class="container">







<div class="hero">


<h1>

🗑️ 销毁费用预估

</h1>


<p>

快速计算产品销毁总成本

</p>


</div>









<!-- 基础设置 -->


<div class="tool-card">


<h2>

⚙️ 基础设置

</h2>






<div class="input-row">



<div>


<label>

USD / CNY 汇率

</label>


<input

id="exchange-rate"

type="number"

placeholder="例如 7.15">


</div>



</div>






</div>









<!-- 产品信息 -->


<div class="tool-card">


<h2>

📦 产品信息

</h2>







<div class="input-row">



<div>


<label>

单件货本（人民币）

</label>


<input

id="goods-cost"

type="number"

placeholder="例如35">


</div>








<div>


<label>

产品数量（件）

</label>


<input

id="quantity"

type="number"

placeholder="例如100">


</div>



</div>









<div class="input-row">



<div>


<label>

单件重量（g）

</label>


<input

id="weight"

type="number"

placeholder="例如350">


</div>








<div>


<label>

销毁费（USD/kg）

</label>


<input

id="destroy-fee"

type="number"

placeholder="例如0.55">


</div>



</div>









<div class="input-row">



<div>


<label>

单件出库费（USD）

</label>


<input

id="outbound-fee"

type="number"

placeholder="例如0.4">


</div>



</div>






</div>









<button

class="calculate-btn"

onclick="calculateDestroy()">


计算销毁费用


</button>









<div class="result-box">


<h3>

📊 销毁结果

</h3>





<p id="destroy-result">

等待计算...

</p>





</div>









</div>


</main>



</div>









<script src="destroy.js"></script>

<script src="nav.js"></script>


</body>


</html>
