<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>当月TC预估</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="app-layout">



<!-- 左侧导航 -->

<aside class="sidebar">


<div class="brand">


<h2>
Ian OS
</h2>


<p>
TikTok运营系统
</p>


</div>





<div class="menu">


<a href="index.html" class="menu-item">

🏠 首页

</a>



<a href="height.html" class="menu-item">

📏 身高体重换算

</a>



<a href="commission.html" class="menu-item active">

💰 当月TC预估

</a>



<a href="destroy.html" class="menu-item">

🗑️ 销毁费用预估

</a>



</div>




<div class="sidebar-footer">

Ian OS v1.0

</div>



</aside>









<main class="content">



<div class="container">










<div class="hero">


<h1>

💰 当月TC预估

</h1>


<p>

根据销售数据预测本月表现

</p>


</div>









<!-- 基础设置 -->


<div class="tool-card">


<h2>

⚙️ 基础设置

</h2>



<div class="input-row">


<div>


<label>
选择月份
</label>


<input 
id="month"
type="month">


</div>





<div>


<label>
USD / CNY 汇率
</label>


<input 
id="exchange-rate"
type="number"
placeholder="例如 7.15">


</div>


</div>


</div>









<!-- 每日销售 -->


<div class="tool-card">


<h2>

📅 每日销售记录

</h2>



<div class="input-row">


<div>


<label>

默认每日结算金额（USD）

</label>


<input
id="default-money"
type="number"
placeholder="例如 500">


</div>





<div style="display:flex;align-items:end;">


<button
onclick="fillDailyMoney()"
class="calculate-btn">

自动填充

</button>


</div>


</div>







<div class="table-box">


<table>


<thead>

<tr>

<th>
日期
</th>


<th>
结算金额 ($)
</th>


<th>
销量
</th>


</tr>


</thead>



<tbody id="daily-container">


</tbody>



</table>


</div>



</div>









<!-- 销售概览 -->


<div class="result-box">


<h3>

📊 销售概览

</h3>



<p id="money-result">

等待输入结算金额...

</p>



<p id="sales-result">

等待输入销量...

</p>



</div>









<!-- 成本 -->


<div class="tool-card">


<h2>

💰 成本分析

</h2>






<div class="input-row">


<div>


<label>

单件货本（人民币）

</label>


<input
id="product-cost"
type="number"
placeholder="例如 35">


</div>





<div>


<label>

广告费（USD）

</label>


<input
id="ads-cost"
type="number"
placeholder="例如 1000">


</div>


</div>









<div class="input-row">


<div>


<label>

仓发费（人民币）

</label>


<input
id="warehouse-cost"
type="number">


</div>




<div>


<label>

头程费（人民币）

</label>


<input
id="shipping-cost"
type="number">


</div>



</div>









<div class="input-row">


<div>


<label>

样品费（人民币）

</label>


<input
id="sample-cost"
type="number">


</div>




<div>


<label>

其他费用（人民币）

</label>


<input
id="other-cost"
type="number">


</div>



</div>








<div class="input-row">


<div>


<label>

社保公积金（人民币）

</label>


<input
id="social-security-cost"
type="number"
placeholder="例如 500">


</div>




<div>


<label>

上月待抵扣费用（人民币）

</label>


<input
id="deduction-cost"
type="number"
placeholder="例如 1000">


</div>



</div>





</div>









<button
onclick="calculateTC()"
class="calculate-btn">

计算TC

</button>









<div class="result-box">


<h3>

🔥 TC预测结果

</h3>



<p id="commission-result">

等待计算...

</p>



</div>









</div>


</main>



</div>








<script src="commission.js"></script>


</body>


</html>
