<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>尺码助手</title>

<link
    rel="stylesheet"
    href="style.css"
>

</head>


<body>


<div class="app-layout">


    <!-- =====================================================
    左侧导航
    ===================================================== -->

    <aside class="sidebar">


        <div class="brand">

            <h2>
                Ian OS
            </h2>

            <p>
                TikTok运营效率工具
            </p>

        </div>


        <!-- 导航由 nav.js 自动生成 -->

        <div
            class="menu"
            id="menu"
        ></div>


        <div class="sidebar-footer">

            Ian OS v1.0

        </div>


    </aside>



    <!-- =====================================================
    右侧内容
    ===================================================== -->

    <main class="content">


        <div class="container">


            <!-- =================================================
            页面标题
            ================================================= -->

            <div class="hero">

                <h1>
                    👕 尺码助手
                </h1>

                <p>
                    输入身高体重，快速换算并匹配相近身材的达人穿搭参考
                </p>

            </div>



            <!-- =================================================
            身高体重输入
            ================================================= -->

            <div class="tool-card">


                <h2>
                    输入信息
                </h2>


                <div class="input-row">


                    <div>

                        <label>
                            Height (ft)
                        </label>

                        <input
                            id="height-ft"
                            type="number"
                            min="0"
                            step="1"
                            placeholder="例如：5"
                        >

                    </div>



                    <div>

                        <label>
                            Height (in)
                        </label>

                        <input
                            id="height-in"
                            type="number"
                            min="0"
                            step="0.1"
                            placeholder="例如：10"
                        >

                    </div>


                </div>



                <div class="input-row">


                    <div>

                        <label>
                            Weight (lbs)
                        </label>

                        <input
                            id="weight-lbs"
                            type="number"
                            min="0"
                            step="0.1"
                            placeholder="例如：165"
                        >

                    </div>


                </div>



                <button
                    id="convertBtn"
                    class="calculate-btn"
                    type="button"
                >
                    计算
                </button>


            </div>



            <!-- =================================================
            计算结果
            ================================================= -->

            <div class="result-box">


                <h3>
                    计算结果
                </h3>


                <div id="result">

                    <p>
                        等待计算...
                    </p>

                </div>


            </div>



            <!-- =================================================
            达人穿搭参考
            ================================================= -->

            <div class="tool-card creator-tool">


                <h2>
                    👕 达人穿搭参考
                </h2>


                <p>
                    选择达人尺码管理中已有的产品，根据你的身高体重匹配相近身材的达人。
                </p>



                <label>
                    选择产品
                </label>


                <!--
                    注意：

                    这里绝对不再写
                    「正在读取产品」

                    页面打开的时候直接显示
                    「请选择产品」

                    Supabase 会在后台静默读取
                -->

                <select
                    id="productSelect"
                >

                    <option value="">
                        请选择产品
                    </option>

                </select>



                <br>
                <br>



                <button
                    id="creatorMatchBtn"
                    class="calculate-btn"
                    type="button"
                >
                    查看参考达人
                </button>



                <div id="creatorResult">

                    <p>
                        等待匹配...
                    </p>

                </div>


            </div>


        </div>


    </main>


</div>



<!-- =====================================================
Supabase 官方 JS
===================================================== -->

<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>



<!-- =====================================================
Supabase 连接
===================================================== -->

<script
    src="supabase.js?v=31"
></script>



<!-- =====================================================
左侧导航
===================================================== -->

<script
    src="nav.js?v=31"
></script>



<!-- =====================================================
尺码助手核心程序
===================================================== -->

<script
    src="size.js?v=31"
></script>


</body>

</html>
